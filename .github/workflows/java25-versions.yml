name: Java 25 Minecraft versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build and test all supported versions
        shell: pwsh
        run: .\scripts\build-java25-versions.ps1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: death-restart-java25
          path: build/versions/*/libs/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: death-restart-test-reports
          path: |
            build/versions/*/test-results/test/*.xml
            build/versions/*/reports/tests/test/
          if-no-files-found: warn
