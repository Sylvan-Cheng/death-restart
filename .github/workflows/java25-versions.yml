name: Java 25 Minecraft versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test all supported versions
        shell: pwsh
        run: .\scripts\build-java25-versions.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: death-restart-java25
          path: build/versions/*/libs/*.jar
          if-no-files-found: error
