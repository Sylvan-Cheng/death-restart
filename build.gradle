plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://mirrors.huaweicloud.com/repository/maven' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        deathrestart {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Use ordinary clients: the GameTest phased scheduler interferes with full server shutdown.
sourceSets {
    integration {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}
loom {
    mods {
        'deathrestart-integration' { sourceSet sourceSets.integration }
    }
    runs {
        lanTestHost {
            client()
            source sourceSets.integration
            runDir 'build/lan-test-host'
            programArgs '--username', 'DeathRestartHost'
            vmArg '-Ddeathrestart.test.role=host'
            vmArg "-Ddeathrestart.test.sync=${layout.buildDirectory.dir('lan-test-sync').get().asFile.absolutePath}"
        }
        lanTestGuest {
            client()
            source sourceSets.integration
            runDir 'build/lan-test-guest'
            programArgs '--username', 'DeathRestartGuest'
            vmArg '-Ddeathrestart.test.role=guest'
            vmArg "-Ddeathrestart.test.sync=${layout.buildDirectory.dir('lan-test-sync').get().asFile.absolutePath}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "com.terraformersmc:modmenu:18.0.2"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(Jar).configureEach {
    from('LICENSE', 'COPYING', 'NOTICE')
}
